<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a large orange beak riding a red bicycle.</desc>
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" rx="20" fill="#DDF3FF"/>
  <circle cx="700" cy="80" r="45" fill="#FFDF5D" stroke="#F2B705" stroke-width="4"/>
  <circle cx="700" cy="80" r="60" fill="#FFDF5D" opacity="0.25"/>
  <!-- clouds -->
  <g fill="white" opacity="0.95">
    <ellipse cx="150" cy="90" rx="55" ry="25"/>
    <ellipse cx="195" cy="80" rx="45" ry="22"/>
    <ellipse cx="110" cy="80" rx="35" ry="18"/>
    <ellipse cx="550" cy="130" rx="45" ry="20"/>
    <ellipse cx="585" cy="122" rx="35" ry="17"/>
  </g>
  <!-- distant hills -->
  <ellipse cx="200" cy="530" rx="300" ry="80" fill="#B8E6A0"/>
  <ellipse cx="650" cy="540" rx="320" ry="90" fill="#A8DC96"/>
  <!-- ground + road -->
  <rect x="0" y="500" width="800" height="100" fill="#7CC46A"/>
  <rect x="0" y="500" width="800" height="70" rx="0" fill="#5A5A5A"/>
  <rect x="0" y="500" width="800" height="10" fill="#6E6E6E"/>
  <g fill="white" opacity="0.9">
    <rect x="20" y="530" width="60" height="8" rx="4"/>
    <rect x="120" y="530" width="60" height="8" rx="4"/>
    <rect x="220" y="530" width="60" height="8" rx="4"/>
    <rect x="320" y="530" width="60" height="8" rx="4"/>
    <rect x="420" y="530" width="60" height="8" rx="4"/>
    <rect x="520" y="530" width="60" height="8" rx="4"/>
    <rect x="620" y="530" width="60" height="8" rx="4"/>
    <rect x="720" y="530" width="60" height="8" rx="4"/>
  </g>
  <!-- speed lines -->
  <g stroke="#9AD0F5" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="80" y1="350" x2="160" y2="350"/>
    <line x1="60" y1="390" x2="170" y2="390"/>
    <line x1="90" y1="430" x2="160" y2="430"/>
  </g>
  <!-- BICYCLE -->
  <g id="bicycle">
    <!-- chain -->
    <line x1="250" y1="435" x2="410" y2="432" stroke="#333" stroke-width="4"/>
    <line x1="250" y1="465" x2="410" y2="468" stroke="#333" stroke-width="4"/>
    <!-- wheels -->
    <g id="rear-wheel">
      <circle cx="250" cy="450" r="75" fill="white" stroke="#222" stroke-width="14"/>
      <circle cx="250" cy="450" r="62" fill="none" stroke="#999" stroke-width="4"/>
      <g stroke="#BBBBBB" stroke-width="3">
        <line x1="250" y1="450" x2="250" y2="392"/>
        <line x1="250" y1="450" x2="250" y2="508"/>
        <line x1="250" y1="450" x2="192" y2="450"/>
        <line x1="250" y1="450" x2="308" y2="450"/>
        <line x1="250" y1="450" x2="209" y2="409"/>
        <line x1="250" y1="450" x2="291" y2="491"/>
        <line x1="250" y1="450" x2="291" y2="409"/>
        <line x1="250" y1="450" x2="209" y2="491"/>
      </g>
      <circle cx="250" cy="450" r="10" fill="#444" stroke="#222" stroke-width="3"/>
    </g>
    <g id="front-wheel">
      <circle cx="560" cy="450" r="75" fill="white" stroke="#222" stroke-width="14"/>
      <circle cx="560" cy="450" r="62" fill="none" stroke="#999" stroke-width="4"/>
      <g stroke="#BBBBBB" stroke-width="3">
        <line x1="560" y1="450" x2="560" y2="392"/>
        <line x1="560" y1="450" x2="560" y2="508"/>
        <line x1="560" y1="450" x2="502" y2="450"/>
        <line x1="560" y1="450" x2="618" y2="450"/>
        <line x1="560" y1="450" x2="519" y2="409"/>
        <line x1="560" y1="450" x2="601" y2="491"/>
        <line x1="560" y1="450" x2="601" y2="409"/>
        <line x1="560" y1="450" x2="519" y2="491"/>
      </g>
      <circle cx="560" cy="450" r="10" fill="#444" stroke="#222" stroke-width="3"/>
    </g>
    <!-- frame -->
    <g fill="none" stroke="#E53935" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="250" y1="450" x2="330" y2="310"/> <!-- seat stay -->
      <line x1="250" y1="450" x2="410" y2="450"/> <!-- chain stay -->
      <line x1="330" y1="310" x2="410" y2="450"/> <!-- seat tube -->
      <line x1="330" y1="310" x2="540" y2="300"/> <!-- top tube -->
      <line x1="410" y1="450" x2="558" y2="350"/> <!-- down tube -->
      <line x1="558" y1="350" x2="560" y2="450"/> <!-- fork -->
      <line x1="535" y1="295" x2="560" y2="355" stroke="#C62828" stroke-width="12"/> <!-- head tube -->
    </g>
    <!-- seat post + saddle -->
    <line x1="330" y1="310" x2="320" y2="285" stroke="#888" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="305" cy="279" rx="38" ry="12" fill="#222" stroke="#111" stroke-width="2"/>
    <ellipse cx="305" cy="275" rx="30" ry="6" fill="#444"/>
    <!-- handlebar stem + bars -->
    <line x1="535" y1="295" x2="552" y2="265" stroke="#888" stroke-width="7" stroke-linecap="round"/>
    <path d="M 552 265 Q 580 260 575 285 Q 572 295 563 292" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <rect x="555" y="283" width="22" height="12" rx="6" fill="#222" transform="rotate(-15 566 289)"/>
    <!-- chainring + cranks + pedals -->
    <circle cx="410" cy="450" r="24" fill="#DDD" stroke="#222" stroke-width="5"/>
    <circle cx="410" cy="450" r="6" fill="#222"/>
    <line x1="410" y1="450" x2="375" y2="487" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <line x1="410" y1="450" x2="445" y2="413" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <rect x="355" y="482" width="40" height="12" rx="3" fill="#222" transform="rotate(10 375 488)"/>
    <rect x="425" y="408" width="40" height="12" rx="3" fill="#222" transform="rotate(10 445 414)"/>
  </g>
  <!-- PELICAN -->
  <g id="pelican">
    <!-- back leg (far side) -->
    <path d="M 395 340 L 445 413" fill="none" stroke="#E67E00" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="448" cy="414" rx="18" ry="9" fill="#FF8C00" stroke="#8D4D00" stroke-width="2.5" transform="rotate(10 448 414)"/>
    <!-- tail -->
    <path d="M 285 250 L 225 225 L 238 258 L 220 275 L 242 285 L 230 305 L 285 300 Z" fill="white" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="380" cy="275" rx="112" ry="72" fill="white" stroke="#333" stroke-width="3.5" transform="rotate(-8 380 275)"/>
    <!-- neck (outline + fill) -->
    <path d="M 455 260 C 480 230 465 200 476 165" fill="none" stroke="#333" stroke-width="48" stroke-linecap="round"/>
    <path d="M 455 260 C 480 230 465 200 476 165" fill="none" stroke="white" stroke-width="40" stroke-linecap="round"/>
    <!-- wing on body -->
    <g transform="rotate(-18 360 285)">
      <ellipse cx="360" cy="285" rx="72" ry="44" fill="#EDEDED" stroke="#333" stroke-width="3"/>
      <path d="M 305 275 Q 360 295 415 270" fill="none" stroke="#AAA" stroke-width="3" stroke-linecap="round"/>
      <path d="M 308 290 Q 360 310 412 285" fill="none" stroke="#AAA" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- front wing / arm reaching to handlebar -->
    <path d="M 430 270 C 480 265 525 265 563 285" fill="none" stroke="#333" stroke-width="20" stroke-linecap="round"/>
    <path d="M 430 270 C 480 265 525 265 563 285" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <circle cx="566" cy="286" r="9" fill="#FF8C00" stroke="#333" stroke-width="2.5"/>
    <!-- front leg (near side) -->
    <path d="M 360 335 L 375 487" fill="none" stroke="#FF8C00" stroke-width="13" stroke-linecap="round"/>
    <path d="M 360 335 L 375 487" fill="none" stroke="#FFA733" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="376" cy="488" rx="20" ry="10" fill="#FF8C00" stroke="#8D4D00" stroke-width="2.5" transform="rotate(10 376 488)"/>
    <!-- head -->
    <circle cx="488" cy="140" r="36" fill="white" stroke="#333" stroke-width="3.5"/>
    <!-- crest feather -->
    <path d="M 465 115 Q 455 95 470 85 Q 475 100 480 112 Z" fill="white" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- beak + pouch -->
    <path d="M 515 156 L 630 162 L 575 218 L 520 178 Z" fill="#FFB598" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 514 128 L 652 152 L 514 162 Z" fill="#FF9F1C" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <line x1="514" y1="162" x2="652" y2="152" stroke="#8D4D00" stroke-width="2"/>
    <!-- eye + cheek -->
    <circle cx="496" cy="130" r="8" fill="#222"/>
    <circle cx="498.5" cy="127.5" r="2.8" fill="white"/>
    <ellipse cx="480" cy="150" rx="8" ry="5" fill="#FFB3B3" opacity="0.8"/>
    <!-- scarf -->
    <path d="M 462 168 Q 475 182 493 172 L 488 158 Q 473 165 462 168" fill="#C62828" stroke="#7A1A1A" stroke-width="2"/>
    <path d="M 465 175 C 420 185 390 175 350 195 C 390 195 410 210 470 185 Z" fill="#E53935" stroke="#7A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 460 182 C 430 190 405 188 385 198" fill="none" stroke="#7A1A1A" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- basket with fish? small touch -->
  <g id="basket">
    <path d="M 580 310 L 630 310 L 620 355 L 590 355 Z" fill="#C68B4E" stroke="#5D3A12" stroke-width="3" stroke-linejoin="round"/>
    <line x1="585" y1="325" x2="627" y2="325" stroke="#5D3A12" stroke-width="2"/>
    <line x1="587" y1="340" x2="623" y2="340" stroke="#5D3A12" stroke-width="2"/>
    <path d="M 592 310 Q 595 295 610 298 Q 618 300 615 310" fill="#7ED6FF" stroke="#333" stroke-width="2.5"/>
    <path d="M 610 298 L 618 290 L 620 300" fill="#7ED6FF" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>