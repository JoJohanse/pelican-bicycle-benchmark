  <circle cx="442" cy="140" r="7.5" fill="#1c1c1c"/>
  <circle cx="444" cy="137.5" r="2.5" fill="#ffffff"/>
  <circle cx="450" cy="153" r="5" fill="#ffb4a2" opacity="0.7"/>

