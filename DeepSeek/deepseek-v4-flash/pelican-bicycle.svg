  <path d="M 352 316 C 372 344 396 372 416 404" stroke="#f4a261" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M 408 400 Q 410 417 424 415 Q 432 412 431 399 Q 430 391 418 392 Q 409 392 408 400 Z" fill="#f4a261" stroke="#343a40" stroke-width="3" stroke-linejoin="round"/>
