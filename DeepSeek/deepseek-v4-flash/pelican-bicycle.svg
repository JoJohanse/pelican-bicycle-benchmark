  <path d="M 460 136 C 504 128 548 136 583 149 C 587 152 588 157 585 161 L 460 156 Z" fill="#f4a261" stroke="#343a40" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 472 142 L 483 141" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 460 156 C 498 198 548 192 579 161 C 550 172 518 172 478 167 C 469 165 462 161 460 156 Z" fill="#e76f51" stroke="#343a40" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 498 178 C 528 176 554 169 571 162" stroke="#c0573d" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 472 168 C 500 184 530 180 548 170" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- scarf -->
  <path d="M 376 190 C 394 168 418 168 430 180" stroke="#e63946" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M 400 186 C 352 192 300 184 262 198 C 258 206 264 210 274 210 C 300 202 346 208 390 200 Z" fill="#e63946" stroke="#343a40" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 390 202 C 342 214 302 216 270 226 C 274 234 286 234 298 230 C 332 222 362 216 386 210 Z" fill="#d62828" stroke="#343a40" stroke-width="3" stroke-linejoin="round"/>
