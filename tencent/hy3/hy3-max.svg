<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#eaf4fb"/>
  <circle cx="320" cy="60" r="28" fill="#ffe08a"/>
  <ellipse cx="80" cy="50" rx="34" ry="14" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="110" cy="58" rx="26" ry="11" fill="#ffffff" opacity="0.7"/>

  <!-- Ground -->
  <rect y="250" width="400" height="50" fill="#cdeccd"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#a9d6a9" stroke-width="2"/>

  <!-- Bicycle -->
  <g stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Wheels -->
    <circle cx="120" cy="220" r="38"/>
    <circle cx="280" cy="220" r="38"/>
    <!-- Spokes -->
    <g stroke-width="1.5" stroke="#777">
      <line x1="120" y1="182" x2="120" y2="258"/>
      <line x1="82"  y1="220" x2="158" y2="220"/>
      <line x1="93"  y1="193" x2="147" y2="247"/>
      <line x1="147" y1="193" x2="93"  y2="247"/>
      <line x1="280" y1="182" x2="280" y2="258"/>
      <line x1="242" y1="220" x2="318" y2="220"/>
      <line x1="253" y1="193" x2="307" y2="247"/>
      <line x1="307" y1="193" x2="253" y2="247"/>
    </g>
    <!-- Frame -->
    <line x1="120" y1="220" x2="200" y2="220"/>
    <line x1="200" y1="220" x2="170" y2="160"/>
    <line x1="120" y1="220" x2="170" y2="160"/>
    <line x1="200" y1="220" x2="280" y2="220"/>
    <line x1="280" y1="220" x2="170" y2="160"/>
    <!-- Seat post + seat -->
    <line x1="170" y1="160" x2="170" y2="140"/>
    <!-- Handlebar post -->
    <line x1="200" y1="220" x2="225" y2="150"/>
    <line x1="225" y1="150" x2="245" y2="150"/>
    <!-- Pedals -->
    <circle cx="200" cy="220" r="6" fill="#2b2b2b"/>
    <line x1="200" y1="220" x2="185" y2="240"/>
    <line x1="185" y1="240" x2="200" y2="240" stroke-width="6"/>
  </g>
  <rect x="160" y="134" width="26" height="8" rx="3" fill="#2b2b2b"/>

  <!-- Pelican -->
  <g>
    <!-- Tail -->
    <path d="M150 120 Q120 110 110 130 Q135 135 152 132 Z" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.5"/>
    <!-- Body -->
    <ellipse cx="190" cy="115" rx="46" ry="38" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
    <!-- Wing -->
    <path d="M180 100 Q210 95 225 120 Q205 130 182 125 Z" fill="#eaeaea" stroke="#cfcfcf" stroke-width="1.5"/>
    <!-- Neck -->
    <path d="M205 95 Q220 60 235 55 Q240 70 228 92 Z" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
    <!-- Head -->
    <circle cx="240" cy="50" r="18" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="246" cy="46" r="3.5" fill="#2b2b2b"/>
    <!-- Beak (upper) -->
    <path d="M255 46 L295 52 L256 58 Z" fill="#ffb347" stroke="#e89b2e" stroke-width="1.5"/>
    <!-- Beak pouch (lower) -->
    <path d="M256 58 Q278 78 295 52 Q275 64 258 60 Z" fill="#ffcf6b" stroke="#e89b2e" stroke-width="1.5"/>

    <!-- Leg to pedal -->
    <line x1="190" y1="150" x2="200" y2="220" stroke="#ffb347" stroke-width="5" stroke-linecap="round"/>
    <line x1="200" y1="220" x2="185" y2="240" stroke="#ffb347" stroke-width="5" stroke-linecap="round"/>
    <!-- Foot -->
    <path d="M178 240 L200 240" stroke="#e89b2e" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
